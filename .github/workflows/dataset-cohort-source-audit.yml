name: Dataset Cohort Source Audit

"on":
  push:
    branches: [main]
    paths:
      - "training_control/dataset_cohort_runtime_entry.py"
      - "training_control/esd_deterministic_data_v1.py"
      - "training_control/run_metric_learning_exact_v1.py"
      - "training_control/esd_scientific_job_catalog_v2.py"
      - "training_control/esd_scientific_job_catalog_v3.py"
      - "training_control/esd_dataset_cohort_catalog_v1.py"
      - "training_control/esd_dataset_cohort_catalog_v2.py"
      - "training_control/esd_native_batch_iterator_v1.py"
      - "training_control/esd_native_step_contract_v1.py"
      - "training_control/esd_shared_batch_broker_v1.py"
      - "training_control/esd_shared_batch_broker_v2.py"
      - "training_control/esd_lockstep_orchestrator_v1.py"
      - "training_control/run_esd_supervised_cohort_v1.py"
      - "training_control/esd_supervised_cohort_pressure_v1.py"
      - "tests/test_esd_deterministic_data_v1.py"
      - "tests/test_esd_shared_batch_broker_v2.py"
      - "run_all_training.py"
      - ".github/workflows/dataset-cohort-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile cohort execution surfaces
        run: |
          python -m py_compile \
            training_control/dataset_cohort_runtime_entry.py \
            training_control/esd_deterministic_data_v1.py \
            training_control/run_metric_learning_exact_v1.py \
            training_control/esd_scientific_job_catalog_v2.py \
            training_control/esd_scientific_job_catalog_v3.py \
            training_control/esd_dataset_cohort_catalog_v1.py \
            training_control/esd_dataset_cohort_catalog_v2.py \
            training_control/esd_native_batch_iterator_v1.py \
            training_control/esd_native_step_contract_v1.py \
            training_control/esd_shared_batch_broker_v1.py \
            training_control/esd_shared_batch_broker_v2.py \
            training_control/esd_lockstep_orchestrator_v1.py \
            training_control/run_esd_supervised_cohort_v1.py \
            training_control/esd_supervised_cohort_pressure_v1.py \
            tests/test_esd_deterministic_data_v1.py \
            tests/test_esd_shared_batch_broker_v2.py \
            run_all_training.py
      - name: Exercise restart-addressable seed tests
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("tests/test_esd_deterministic_data_v1.py")
          spec = importlib.util.spec_from_file_location("_esd_seed_tests", path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load deterministic seed tests")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = sorted(name for name in dir(module) if name.startswith("test_") and callable(getattr(module, name)))
          if not tests:
              raise SystemExit("no deterministic seed tests discovered")
          for name in tests:
              getattr(module, name)()
          print(f"ESD deterministic seed tests: PASS ({len(tests)})")
          PY
      - name: Exercise completion-aware shared batch broker
        run: PYTHONPATH=training_control python tests/test_esd_shared_batch_broker_v2.py
      - name: Certify lossless logical to physical mapping
        run: |
          PYTHONPATH=training_control python - <<'PY'
          import json
          import esd_dataset_cohort_catalog_v2 as cohorts
          import esd_scientific_job_catalog_v2 as logical
          import esd_scientific_job_catalog_v3 as physical

          grouped = cohorts.compile_catalog()
          meta = physical.catalog_metadata()
          if grouped["schema"] != "esd-dataset-cohort-catalog/v2":
              raise SystemExit("unexpected ESD cohort compiler schema")
          if not grouped["overlap_group_last"]:
              raise SystemExit("ESD overlap group is not last")
          if meta["schema"] != "esd-scientific-job-catalog/v3":
              raise SystemExit("unexpected ESD physical catalog schema")
          if not meta["all_supported_logical_jobs_mapped_once"]:
              raise SystemExit("ESD v3 does not map supported optimizer jobs exactly once")
          if meta["cohorted_logical_jobs"] <= 0 or meta["physical_supervised_cohorts"] <= 0:
              raise SystemExit("ESD v3 contains no physical supervised cohorts")

          logical_ids = {str(row["id"]) for row in logical.iter_jobs()}
          rows = list(physical.iter_jobs())
          physical_ids = [str(row["id"]) for row in rows]
          if len(physical_ids) != len(set(physical_ids)):
              raise SystemExit("ESD v3 emitted duplicate physical IDs")
          for row in rows:
              for dep in row.get("depends_on") or []:
                  if dep not in set(physical_ids):
                      raise SystemExit(f"ESD v3 dependency {dep!r} is not physically reachable")
          members = [
              child
              for row in rows
              if row.get("dataset_cohort")
              for child in row.get("logical_job_ids") or []
          ]
          if len(members) != len(set(members)):
              raise SystemExit("ESD logical optimizer appears in multiple physical cohorts")
          if not set(members).issubset(logical_ids):
              raise SystemExit("ESD physical cohort references a non-logical job")
          print(json.dumps(meta, indent=2, sort_keys=True))
          PY
      - name: Audit physical execution invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              "training_control/esd_shared_batch_broker_v2.py": (
                  'SCHEMA = "esd-shared-batch-broker/v2"',
                  "register_consumer",
                  "deactivate",
                  "transition",
                  "assert_batch_boundary_clean",
                  "sampler divergence",
              ),
              "training_control/esd_lockstep_orchestrator_v1.py": (
                  "set(self._arrivals) != self._active",
                  "stream_signature",
                  "NativeSharedBatchIterator",
                  "restore_rng",
                  "capture_rng",
                  "before_round",
                  "after_round",
              ),
              "training_control/run_esd_supervised_cohort_v1.py": (
                  'choices=("auto", "cpu", "gpu")',
                  "CUDA_VISIBLE_DEVICES",
                  "CohortCheckpointJournal",
                  "recover_if_needed",
                  "residency_window_safe",
                  "max_resident_models",
              ),
              "training_control/esd_supervised_cohort_pressure_v1.py": (
                  "TRAINING_CHECKPOINT_REQUEST_FILE",
                  "TRAINING_CHECKPOINT_ACK_FILE",
                  "clean_shared_batch_frontier",
                  "shared_cursor_committed",
              ),
          }
          for filename, markers in checks.items():
              text = Path(filename).read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f"{filename}: missing invariant {marker!r}")

          root = Path("run_all_training.py").read_text(encoding="utf-8")
          for marker in (
              '"path": "training_control/esd_scientific_job_catalog_v3.py"',
              '"require_dataset_cohort_execution": True',
              '"require_cpu_gpu_backend_variants": True',
              '"require_shared_batch_views": True',
              '"require_uniform_cohort_batch_size": True',
              '"require_cohort_exact_resume": True',
              '"require_lossless_dataset_stream_compatibility": True',
          ):
              if marker not in root:
                  raise SystemExit(f"root controller missing ESD cohort invariant: {marker}")
          print("ESD v3 physical cohort source contract: PASS")
          PY
