name: ESD Native Cohort Adapter Contract

"on":
  push:
    branches: [main]
    paths:
      - "scripts/metric_learning_pipeline.py"
      - "scripts/train_phase0_mim.py"
      - "training_control/esd_deterministic_data_v1.py"
      - "training_control/esd_dataset_cohort_catalog_v2.py"
      - "training_control/esd_shared_batch_broker_v2.py"
      - "training_control/esd_native_step_contract_v1.py"
      - "training_control/esd_native_batch_iterator_v1.py"
      - "tests/test_esd_native_batch_iterator_v1.py"
      - ".github/workflows/esd-native-step-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-step-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile adapter surfaces
        run: |
          python -m py_compile \
            training_control/esd_native_step_contract_v1.py \
            training_control/esd_native_batch_iterator_v1.py \
            tests/test_esd_native_batch_iterator_v1.py
      - name: Prove native cohort adapter seam
        run: python training_control/esd_native_step_contract_v1.py
      - name: Test native shared-batch iterator
        run: python -m pytest -q tests/test_esd_native_batch_iterator_v1.py
      - name: Refuse premature root activation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("run_all_training.py").read_text(encoding="utf-8")
          contract = Path("training_control/esd_native_step_contract_v1.py").read_text(encoding="utf-8")
          iterator = Path("training_control/esd_native_batch_iterator_v1.py").read_text(encoding="utf-8")
          if '"physical_cohort_execution_activated": False' not in contract:
              raise SystemExit("native step contract must remain explicit about non-activation")
          for marker in (
              "derive_batch_coordinate",
              "SharedBatchBroker.acquire",
              "step_limit=1",
              "assert_batch_boundary_clean",
          ):
              if marker not in iterator:
                  raise SystemExit(f"ESD native iterator lost physical-batch invariant: {marker}")
          if '"require_dataset_cohort_execution": True' in root:
              raise SystemExit(
                  "ESD root advertises physical cohort execution before a native model adapter/worker is certified"
              )
          print("ESD native model-step + shared-batch iterator seam: PASS; root activation remains fail-closed")
          PY
